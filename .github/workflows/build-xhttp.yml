name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt

      - name: Unit tests
        run: .venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Build one-file exe
        run: .venv\Scripts\python.exe -m PyInstaller --noconfirm --clean xhttp.spec

      - name: Smoke test (config check)
        run: |
          .\dist\xhttp.exe --check --server 127.0.0.1:443 --uuid 00000000-0000-0000-0000-000000000000 --path /xhttp --sni example.com --listen 1080

      - uses: actions/upload-artifact@v4
        with:
          name: xhttp-windows
          path: dist/xhttp.exe
          if-no-files-found: error
